name: HomeLane
description: 'HomeLane is an Indian end-to-end interior design company that delivers
  customized home interiors — modular kitchens, wardrobes, storage, bedroom, living
  room, bathroom, and home-office designs — pairing in-house digital design and 3D
  visualization tools with material selection and professional installation, backed
  by a 45-day delivery guarantee on end-to-end modular interiors. Founded in Bangalore
  and backed by Accel, HomeLane operates across major Indian cities through design
  studios, a franchise/partner network, and a customer mobile app. HomeLane currently
  exposes no public developer API; this profile tracks its digital, security, and
  identity surface for the API Evangelist network.'
